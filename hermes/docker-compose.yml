services:
  hermes:
    image: nousresearch/hermes-agent
    container_name: hermes
    stdin_open: true
    tty: true
    restart: unless-stopped

    volumes:
      - ${HOME}/Library/Application Support/Hermes:/opt/data
      - ${HOME}/work/leisure/hermes-workspace:/workspace

    environment:
      TZ: Asia/Kolkata